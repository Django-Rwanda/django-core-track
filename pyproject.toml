[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-rwanda-core-track"
version = "1.0.0"
description = "Django Rwanda 30-Day Developer Acceleration Track Monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.1",
    "django-environ>=0.11.2",
    "django-filter>=24.3",
    "django-cors-headers>=4.4.0",
    "psycopg[binary]>=3.2.0",
    "whitenoise>=6.7.0",
    "gunicorn>=23.0.0",
    "redis>=5.0.8",
    "celery>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "django-stubs>=5.0.4",
    "djangorestframework-stubs>=3.15.1",
]
week-01 = [
    "django>=5.1,<5.2",
    "django-environ>=0.11.2",
]
week-02 = [
    "django>=5.1,<5.2",
    "django-environ>=0.11.2",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.1",
    "django-filter>=24.3",
    "django-cors-headers>=4.4.0",
]
week-03 = [
    "django>=5.1,<5.2",
    "django-environ>=0.11.2",
    "djangorestframework>=3.15.0",
    "psycopg[binary]>=3.2.0",
    "factory-boy>=3.3.1",
]
week-04 = [
    "django>=5.1,<5.2",
    "django-environ>=0.11.2",
    "djangorestframework>=3.15.0",
    "psycopg[binary]>=3.2.0",
    "whitenoise>=6.7.0",
    "gunicorn>=23.0.0",
    "redis>=5.0.8",
    "celery>=5.4.0",
]
all = [
    "django-rwanda-core-track[dev,week-01,week-02,week-03,week-04]",
]


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "**/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "shared.config.settings.development"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
python_files = ["test_*.py", "tests.py", "*_tests.py"]
testpaths = [
    "labs",
]
pythonpath = [
    ".",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
